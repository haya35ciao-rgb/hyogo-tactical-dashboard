<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4DBB">
<title>HYOGO Tactical Dashboard</title>
<style>
:root{--b:#0B4DBB;--b2:#123C8C;--bg:#F5F8FD;--w:#fff;--t:#14213D;--m:#687386;--line:#D9E3F4;--soft:#EAF2FF;--shadow:0 8px 24px rgba(12,51,120,.10);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--t)}
button,input,textarea,select{font:inherit}.app{max-width:920px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:13px 15px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;font-size:10px;opacity:.75;letter-spacing:.08em}.brand strong{font-size:17px}
.mode{display:flex;background:#ffffff22;border-radius:999px;padding:3px}.mode button{border:0;background:transparent;color:#fff;border-radius:999px;padding:7px 10px;font-size:12px}.mode .on{background:#fff;color:var(--b);font-weight:800}
main{padding:16px 16px 90px}.hero{background:linear-gradient(135deg,var(--b),#1D63D6);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.hero h1{font-size:24px;margin:0 0 8px}.hero p{margin:0;opacity:.9}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.sec h2{font-size:17px;margin:0}.pill{display:inline-block;background:var(--soft);color:var(--b);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
.grid{display:grid;gap:12px}.team,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.team{padding:16px;cursor:pointer}.team h3{margin:0;font-size:18px}.team p{margin:7px 0 0;color:var(--m);font-size:13px}
.card{padding:15px;margin-top:12px}.card h3{margin:0 0 10px;font-size:16px}.back,.edit,.ghost,.primary,.secondary{border-radius:11px;padding:9px 12px}.back,.edit,.primary{border:0;background:var(--b);color:#fff}.ghost,.secondary{border:1px solid var(--line);background:#fff;color:var(--t)}
.head{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.head h2{margin:5px 0}.meta{font-size:12px;color:var(--m)}
.critical,.pair{display:grid;gap:10px;margin-top:10px}.box,.analysis,.action{border-radius:14px;padding:13px}.box{background:#FFF6E5;border:1px solid #F2D59A}.analysis{background:#F7F9FC;border:1px solid #E6EBF2}.action{background:var(--soft);border:1px solid #C5D9FF}
.label{font-size:11px;font-weight:800;letter-spacing:.03em;margin-bottom:5px}.value{font-size:14px;line-height:1.55;white-space:pre-wrap}.empty{color:#98A2B3;font-style:italic}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0 6px}.quick button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 3px;font-size:11px}.quick .on{background:var(--b);color:#fff;border-color:var(--b)}
.tabs{display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px}.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
.player{padding:12px 0;border-top:1px solid var(--line)}.player:first-child{border-top:0}.num{display:grid;place-items:center;width:29px;height:29px;background:var(--b);color:#fff;border-radius:50%;font-size:12px;font-weight:800}
.player-title{display:flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.stat{background:#F7F9FC;border:1px solid #E6EBF2;border-radius:12px;padding:9px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--b)}.stat span{font-size:10px;color:var(--m)}
.match-list{display:grid;gap:8px;margin-top:10px}.match-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.match-row strong{font-size:13px}.match-row span{font-size:12px;color:var(--m)}
.video{display:inline-block;color:var(--b);font-weight:800;text-decoration:none;margin-top:8px;font-size:13px}
.sync{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:25;background:#0F1F3A;color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;box-shadow:var(--shadow)}
.modal-wrap{position:fixed;inset:0;background:#07152e88;display:flex;align-items:flex-end;justify-content:center;z-index:99}.modal{width:100%;max-width:920px;max-height:90vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.modal h3{margin:0 0 14px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:100px}
.actions{position:sticky;bottom:0;background:#fff;padding-top:10px;display:flex;gap:8px;justify-content:flex-end}.login-note{font-size:12px;color:var(--m);line-height:1.5}.error{color:#B42318;font-size:12px;margin-top:8px}
@media(min-width:700px){main{padding:24px}.grid{grid-template-columns:repeat(3,1fr)}.pair,.critical{grid-template-columns:1fr 1fr}}
</style>
</head>

function ensureSchema(){
  if(!data.matchReviews) data.matchReviews={};
  if(!data.matchReviews.chiba_ehime){

      id:'chiba_ehime',

function syncText(t){document.getElementById('sync').textContent=t}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function val(s){return s?esc(s):'<span class="empty">未入力</span>'}
function team(){return data.teams.find(t=>t.id===st.teamId)}

async function loadData(){
  if(localPreview){
    data=JSON.parse(localStorage.getItem('hyogo_shared_preview')||'null')||structuredClone(seed);
    ensureSchema();
    syncText('ローカルプレビュー');
    render(); return;
  }
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw 0;
    const j=await r.json();
    data=j.data||structuredClone(seed);
    ensureSchema();
    syncText('共有データ同期済み');
  }catch(e){syncText('読み込みエラー')}
  render();
}
async function saveData(){
  if(localPreview){
    localStorage.setItem('hyogo_shared_preview',JSON.stringify(data));
    syncText('ローカル保存済み'); render(); return true;
  }
  if(!adminToken){loginModal();return false}
  syncText('保存中…');
  const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminToken},body:JSON.stringify({data})});
  if(r.status===401){syncText('認証エラー'); sessionStorage.removeItem('hyogo_admin_token');adminToken='';loginModal('パスコードが違います');return false}
  if(!r.ok){syncText('保存エラー');return false}
  syncText('全員に共有済み');
  render(); return true;
}

<button class="${st.mode==='admin'?'on':''}" onclick="enterAdmin()">監督・コーチ</button>
</div></div></div>`}

function matchReview(t){
  ensureSchema();
  const r=data.matchReviews.chiba_ehime;
  const isChiba=t.id==='chiba';
  const goals=isChiba?r.chibaGoals:r.ehimeGoals;
  const conceded=isChiba?r.chibaConceded:r.ehimeConceded;
  const opp=isChiba?'愛媛県選抜':'千葉県選抜';
  return `<div class="card">
    <div class="row">
      <div><h3 style="margin-bottom:3px">千葉県選抜 vs 愛媛県選抜</h3><div class="meta">共通レビュー｜両チームページに自動反映</div></div>
      ${st.mode==='admin'?`<button class="edit" onclick="editMatchReview()">編集</button>`:''}
    </div>
    ${r.matchInfo?`<div class="analysis" style="margin-top:10px"><div class="label">試合情報</div><div class="value">${val(r.matchInfo)}</div></div>`:''}
    <div class="analysis" style="margin-top:10px"><div class="label">試合レビュー</div><div class="value">${val(r.overallReview)}</div></div>
  </div>
  <div class="card">
    <h3>${esc(t.name)}｜得点・失点シーン</h3>
    <div class="pair">
      <div class="action"><div class="label">得点シーン</div><div class="value">${val(goals)}</div></div>
      <div class="analysis"><div class="label">失点シーン</div><div class="value">${val(conceded)}</div></div>
    </div>
    <div class="meta" style="margin-top:10px">対戦相手：${opp}</div>
  </div>
  <div class="card">
    <h3>共通メモ・参考映像</h3>
    <div class="analysis"><div class="label">共通メモ</div><div class="value">${val(r.commonNotes)}</div></div>
    ${r.video?`<a class="video" href="${esc(r.video)}" target="_blank">▶ 参考映像を開く</a>`:''}

}

function editMatchReview(){
  ensureSchema();
  const r=data.matchReviews.chiba_ehime;
  modal('千葉県選抜 vs 愛媛県選抜｜対戦レビュー',
    field('matchInfo','試合情報',r.matchInfo)+
    field('overallReview','試合レビュー',r.overallReview)+

function genericTeamStats(t){
  if(!t.sourceStats) return '';
  const s=t.sourceStats;
  return `<div class="card">
    <div class="row"><div><h3 style="margin-bottom:3px">直近${s.matches}試合集計</h3><div class="meta">提供された公式試合記録画像から集計</div></div><span class="pill">${s.wins}勝${s.draws}分${s.losses}敗</span></div>
    <div class="stats">
      <div class="stat"><b>${s.gf}</b><span>得点</span></div>
      <div class="stat"><b>${s.ga}</b><span>失点</span></div>
      <div class="stat"><b>${s.shots==null?'—':s.shots}</b><span>シュート</span></div>
    </div>
    <div class="match-list">${s.matchesList.map(m=>`<div class="match-row"><div><b>vs ${esc(m.opponent)}</b><div class="rank-meta">${m.shots==null?'シュート数記載なし':`チームシュート ${esc(m.shots)}本`}${m.note?`｜${esc(m.note)}`:''}</div></div><b>${esc(m.score)}</b></div>`).join('')}</div>
  </div>`;
}

function fukuokaStats(t){
  if(!t.sourceStats) return '';
  const s=t.sourceStats;
  const ranked=[...t.players].filter(p=>Number(p.goals)>0).sort((a,b)=>Number(b.goals)-Number(a.goals)||Number(b.shots)-Number(a.shots)||Number(a.number)-Number(b.number));
  let lastGoals=null, rank=0, idx=0;
  const rows=ranked.map(p=>{
    idx++;
    if(Number(p.goals)!==lastGoals){rank=idx;lastGoals=Number(p.goals);}
    return `<div class="rank-row"><div class="rank-no">${rank}</div><div><b>#${esc(p.number)} ${esc(p.name)}</b><div class="rank-meta">${esc(p.position)}｜シュート ${esc(p.shots)}本</div></div><div class="rank-score">${esc(p.goals)}得点</div></div>`;
  }).join('');
  return `<div class="card">
    <div class="row"><div><h3 style="margin-bottom:3px">直近3試合集計</h3><div class="meta">提供された公式試合記録画像から集計</div></div><span class="pill">${s.wins}勝${s.draws}分${s.losses}敗</span></div>
    <div class="stats">
      <div class="stat"><b>${s.gf}</b><span>得点</span></div>
      <div class="stat"><b>${s.ga}</b><span>失点</span></div>
      <div class="stat"><b>${s.shots==null?'—':s.shots}</b><span>シュート</span></div>
    </div>
    <div class="match-list">${s.matchesList.map(m=>`<div class="match-row"><div><b>vs ${esc(m.opponent)}</b><div class="rank-meta">${m.shots==null?'シュート数記載なし':`チームシュート ${esc(m.shots)}本`}${m.note?`｜${esc(m.note)}`:''}</div></div><b>${esc(m.score)}</b></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="row"><div><h3 style="margin-bottom:3px">得点ランキング</h3><div class="meta">3試合累計｜同得点はシュート数が多い順</div></div><span class="pill">${ranked.length}名得点</span></div>
    <div class="rank-list">${rows}</div>
  </div>`;
}

const phases=[['posAttack','定位置攻撃'],['transDef','攻撃 → 守備'],['posDef','定位置守備'],['transAttack','守備 → 攻撃']];
function setView(t){const s=t.sets[st.setIndex],p=s.phases[st.phase], members=t.players.filter(x=>String(x.setNo||'')===String(st.setIndex+1));return `<div class="card"><div class="row"><h3>${esc(s.name)}</h3><span class="pill">${members.length}名</span></div>

${p.opponentIntent?`<div class="analysis" style="margin-top:10px"><div class="label">相手の狙い / 守り方</div><div class="value">${val(p.opponentIntent)}</div></div>`:''}

${p.video?`<a class="video" href="${esc(p.video)}" target="_blank">▶ 参考映像を開く</a>`:''}</div>`}

function scoringRanking(t){
  const hasShots=t.players.some(p=>p.shots!=='' && p.shots!=null);
  const ranked=[...t.players]
    .filter(p=>Number(p.goals||0)>0)
    .sort((a,b)=>{
      const gd=Number(b.goals||0)-Number(a.goals||0);
      if(gd!==0) return gd;
      if(hasShots){
        const sd=Number(b.shots||0)-Number(a.shots||0);
        if(sd!==0) return sd;
      }
      return Number(a.number||999)-Number(b.number||999);
    });

  let rank=0, prevGoals=null, prevShots=null;
  const rows=ranked.map((p,idx)=>{
    const g=Number(p.goals||0);
    const s=(p.shots===''||p.shots==null)?null:Number(p.shots);
    const tieChanged = hasShots ? (g!==prevGoals || s!==prevShots) : (g!==prevGoals);
    if(tieChanged){ rank=idx+1; prevGoals=g; prevShots=s; }
    const rate=(s!=null && s>0) ? ((g/s)*100).toFixed(1)+'%' : '—';
    return `<div class="rank-row">
      <div class="rank-no">${rank}</div>
      <div>
        <b>#${esc(p.number)} ${esc(p.name)}</b>
        <div class="rank-meta">${esc(p.position||'')}｜シュート ${s==null?'記載なし':s+'本'}${hasShots?`｜決定率 ${rate}`:''}</div>
      </div>
      <div class="rank-score">${g}得点</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="row">
      <div>
        <h3 style="margin-bottom:3px">得点ランキング</h3>
        <div class="meta">${t.sourceStats?t.sourceStats.matches:'-'}試合累計｜${hasShots?'同得点はシュート数が多い選手を上位':'シュート数の記載がないため、同得点は同順位'}</div>
      </div>
      <span class="pill">${ranked.length}名得点</span>
    </div>
    <div class="rank-list">${rows || '<div class="empty">得点者データなし</div>'}</div>
  </div>`;
}
function players(t){const gs=[1,2,3].map(n=>({n,items:t.players.filter(p=>String(p.setNo||'')===String(n))})),un=t.players.filter(p=>!p.setNo);return `<div class="card"><div class="row"><div><h3 style="margin-bottom:3px">相手選手情報一覧</h3><div class="meta">SETごとに整理</div></div>${st.mode==='admin'?`<button class="edit" onclick="editPlayer(-1)">＋ 選手追加</button>`:''}</div></div>
${gs.map(g=>`<div class="card"><div class="row"><h3>SET ${g.n}</h3><span class="pill">${g.items.length}名</span></div>${g.items.length?g.items.map(p=>playerCard(p,t.players.indexOf(p))).join(''):`<div class="empty">未登録</div>`}</div>`).join('')}
${un.length?`<div class="card"><div class="row"><h3>SET未設定</h3><span class="pill">${un.length}名</span></div>${un.map(p=>playerCard(p,t.players.indexOf(p))).join('')}</div>`:''}` }
function playerCard(p,i){return `<div class="player"><div class="row"><div class="player-title"><span class="num">${esc(p.number||'-')}</span><span>${esc(p.name||'選手名未入力')}</span>${p.position?`<span class="pill">${esc(p.position)}</span>`:''}${p.setNo?`<span class="pill">SET ${esc(p.setNo)}</span>`:`<span class="pill">SET未設定</span>`}</div>${st.mode==='admin'?`<button class="ghost" onclick="editPlayer(${i})">編集</button>`:''}</div>
<div class="stats">
  <div class="stat"><b>${esc(p.appearances||'-')}</b><span>対象試合</span></div>
  <div class="stat"><b>${esc(p.goals||'0')}</b><span>得点</span></div>
  <div class="stat"><b>${p.shots===''||p.shots==null?'—':esc(p.shots)}</b><span>シュート</span></div>
</div>
<div class="pair"><div class="analysis"><div class="label">特徴 / 注意事項</div><div class="value">${val([p.features,p.caution].filter(Boolean).join('\n'))}</div></div><div class="action"><div class="label">自チームでやること</div><div class="value">${val(p.ourAction)}</div></div></div>
${p.video?`<a class="video" href="${esc(p.video)}" target="_blank">▶ 参考映像を開く</a>`:''}</div>`}
function render(){ensureSchema();document.getElementById('app').innerHTML=st.teamId?teamPage():home()}
function enterAdmin(){ if(localPreview||adminToken){st.mode='admin';render()} else loginModal() }
function loginModal(msg=''){modalRaw('監督・コーチ編集',`<p class="login-note">管理者パスコードを入力してください。選手にはこのパスコードを共有しないでください。</p><div class="field"><label>管理者パスコード</label><input id="token" type="password" autocomplete="current-password"></div>${msg?`<div class="error">${esc(msg)}</div>`:''}`,()=>{
  adminToken=document.getElementById('token').value.trim(); if(adminToken){sessionStorage.setItem('hyogo_admin_token',adminToken);st.mode='admin';render()}
})}
function modalRaw(title,html,onSave){const w=document.createElement('div');w.className='modal-wrap';w.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${html}<div class="actions"><button class="secondary" id="c">キャンセル</button><button class="primary" id="s">OK</button></div></div>`;document.body.appendChild(w);w.querySelector('#c').onclick=()=>w.remove();w.querySelector('#s').onclick=()=>{onSave();w.remove()}}
function modal(title,fields,onSave){const w=document.createElement('div');w.className='modal-wrap';w.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><form id="f">${fields}<div class="actions"><button type="button" class="secondary" id="c">キャンセル</button><button class="primary">保存して共有</button></div></form></div>`;document.body.appendChild(w);w.querySelector('#c').onclick=()=>w.remove();w.querySelector('#f').onsubmit=async e=>{e.preventDefault();onSave(new FormData(e.target));w.remove();await saveData()}}
function field(n,l,v='',type='textarea'){return `<div class="field"><label>${esc(l)}</label>${type==='input'?`<input name="${n}" value="${esc(v||'')}">`:`<textarea name="${n}">${esc(v||'')}</textarea>`}</div>`}
function selectField(n,l,v=''){return `<div class="field"><label>${esc(l)}</label><select name="${n}"><option value="">SET未設定</option>${[1,2,3].map(x=>`<option value="${x}" ${String(v)===String(x)?'selected':''}>SET ${x}</option>`).join('')}</select></div>`}
function editTop(){const t=team();modal(`${t.name}｜上部`,field('match','試合情報',t.match,'input')+field('topCaution','最重要注意事項',t.topCaution)+field('topAction','自チームの最重要ポイント',t.topAction),fd=>Object.assign(t,Object.fromEntries(fd.entries())))}
function editTeam(){const x=team().team;modal('チーム全体',field('features','相手チームの特徴',x.features)+field('caution','注意事項',x.caution)+field('ourAction','自チームでやること',x.ourAction)+field('playerSummary','選手向け要点',x.playerSummary)+field('memo','監督・コーチメモ',x.memo)+field('video','参考動画URL',x.video,'input'),fd=>Object.assign(x,Object.fromEntries(fd.entries())))}
function editPhase(){const p=team().sets[st.setIndex].phases[st.phase];modal('SET局面編集',field('opponentFeatures','相手の特徴',p.opponentFeatures)+field('opponentIntent','相手の狙い / 守り方',p.opponentIntent)+field('caution','注意事項',p.caution)+field('ourAction','自チームでやること',p.ourAction)+field('playerSummary','選手向け要点',p.playerSummary)+field('memo','詳細メモ',p.memo)+field('video','参考動画URL',p.video,'input'),fd=>Object.assign(p,Object.fromEntries(fd.entries())))}
function editPlayer(i){const t=team(),p=i>=0?t.players[i]:{setNo:'',number:'',name:'',position:'',appearances:'',goals:'',shots:'',features:'',caution:'',ourAction:'',memo:'',video:'',playerSummary:''};modal(i>=0?'選手編集':'選手追加',selectField('setNo','所属SET',p.setNo)+field('number','背番号',p.number,'input')+field('name','選手名',p.name,'input')+field('position','ポジション',p.position,'input')+field('appearances','対象試合数',p.appearances,'input')+field('goals','得点',p.goals,'input')+field('shots','シュート数',p.shots,'input')+field('features','特徴',p.features)+field('caution','注意事項',p.caution)+field('ourAction','自チームでやること',p.ourAction)+field('playerSummary','選手向け要点',p.playerSummary)+field('memo','監督・コーチメモ',p.memo)+field('video','参考動画URL',p.video,'input'),fd=>{const o=Object.fromEntries(fd.entries());i>=0?Object.assign(t.players[i],o):t.players.push(o)})}
loadData();
setInterval(()=>{ if(!localPreview && st.mode==='player') loadData(); },30000);
</script></body></html>
